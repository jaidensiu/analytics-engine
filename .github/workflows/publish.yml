name: Publish

on:
  push:
    branches: [ master ]
    paths:
      - VERSION
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - name: Read version
        run: |
          set -euo pipefail
          VERSION=$(cat VERSION)
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::VERSION file contains '$VERSION', which is not a plain semver (X.Y.Z)"
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" > /dev/null 2>&1; then
            echo "::error::Tag v$VERSION already exists -- has this version already been published?"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Run all tests
        run: ./gradlew build --stacktrace

      - name: Publish Android artifacts to GitHub Packages
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./gradlew -PlibraryVersion="$VERSION" \
            :core:publishAndroidReleasePublicationToGitHubPackagesRepository \
            :core:publishKotlinMultiplatformPublicationToGitHubPackagesRepository \
            --stacktrace

      - name: Build XCFramework
        run: ./gradlew -PlibraryVersion="$VERSION" :core:assembleAnalyticsEngineReleaseXCFramework --stacktrace

      - name: Zip XCFramework and compute checksum
        id: package
        run: |
          cd core/build/XCFrameworks/release
          ditto -c -k --sequesterRsrc --keepParent \
            AnalyticsEngine.xcframework \
            "AnalyticsEngine-$VERSION.xcframework.zip"
          CHECKSUM=$(swift package compute-checksum "AnalyticsEngine-$VERSION.xcframework.zip")
          echo "checksum=$CHECKSUM" >> "$GITHUB_OUTPUT"
          echo "zip_path=core/build/XCFrameworks/release/AnalyticsEngine-$VERSION.xcframework.zip" >> "$GITHUB_OUTPUT"

      - name: Create draft release and upload XCFramework
        id: draft
        run: |
          RELEASE_ID=$(gh api "repos/$GITHUB_REPOSITORY/releases" \
            -f tag_name="v$VERSION" \
            -f name="v$VERSION" \
            -F draft=true \
            -f body="Android: \`com.jaidensiu:core:$VERSION\` via GitHub Packages. iOS: SPM binary target (see Package.swift at tag v$VERSION)." \
            --jq .id)
          ASSET_ID=$(gh api --method POST \
            -H "Content-Type: application/zip" \
            "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?name=AnalyticsEngine-$VERSION.xcframework.zip" \
            --input "${{ steps.package.outputs.zip_path }}" \
            --jq .id)
          echo "release_id=$RELEASE_ID" >> "$GITHUB_OUTPUT"
          echo "asset_id=$ASSET_ID" >> "$GITHUB_OUTPUT"

      - name: Update Package.swift and push to master
        id: manifest
        run: |
          sed -i '' -E \
            "s|url: \"[^\"]*\"|url: \"https://api.github.com/repos/$GITHUB_REPOSITORY/releases/assets/${{ steps.draft.outputs.asset_id }}.zip\"|" \
            Package.swift
          sed -i '' -E \
            "s|checksum: \"[^\"]*\"|checksum: \"${{ steps.package.outputs.checksum }}\"|" \
            Package.swift
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Package.swift
          git commit -m "chore: release v$VERSION"
          git push origin HEAD:master
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Publish release
        run: |
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/${{ steps.draft.outputs.release_id }}" \
            -F draft=false \
            -f target_commitish="${{ steps.manifest.outputs.sha }}"
