name: Publish

on:
  pull_request:
    types: [ closed ]
    branches: [ master ]
    paths:
      - VERSION

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  publish:
    if: >-
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'release/v')
    runs-on: macos-15
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - name: Read version
        run: |
          set -euo pipefail
          VERSION=$(cat VERSION)
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::VERSION file contains '$VERSION', which is not a plain semver (X.Y.Z)"
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" > /dev/null 2>&1; then
            echo "::error::Tag v$VERSION already exists -- has this version already been published?"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Assemble artifacts
        run: ./gradlew assemble --stacktrace

      - name: Publish artifacts to GitHub Packages
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./gradlew -PlibraryVersion="$VERSION" \
            :catalog:publishAllPublicationsToGitHubPackagesRepository \
            --stacktrace

      - name: Build XCFrameworks
        run: |
          ./gradlew -PlibraryVersion="$VERSION" \
            :catalog:assembleOrbitCatalogReleaseXCFramework \
            --stacktrace

      - name: Zip XCFrameworks and compute checksums
        id: package
        run: |
          cd catalog/build/XCFrameworks/release
          ditto -c -k --sequesterRsrc --keepParent \
            OrbitCatalog.xcframework \
            "OrbitCatalog-$VERSION.xcframework.zip"
          CATALOG_CHECKSUM=$(swift package compute-checksum "OrbitCatalog-$VERSION.xcframework.zip")
          echo "catalog_checksum=$CATALOG_CHECKSUM" >> "$GITHUB_OUTPUT"
          echo "catalog_zip_path=catalog/build/XCFrameworks/release/OrbitCatalog-$VERSION.xcframework.zip" >> "$GITHUB_OUTPUT"

      - name: Create draft release and upload XCFrameworks
        id: draft
        run: |
          RELEASE_ID=$(gh api "repos/$GITHUB_REPOSITORY/releases" \
            -f tag_name="v$VERSION" \
            -f name="v$VERSION" \
            -F draft=true \
            -f body="Android: \`com.jaidensiu:orbit-catalog:$VERSION\` via GitHub Packages. iOS: SPM binary target \`OrbitCatalog\` (see Package.swift at tag v$VERSION)." \
            --jq .id)
          gh api --method POST \
            -H "Content-Type: application/zip" \
            "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?name=OrbitCatalog-$VERSION.xcframework.zip" \
            --input "${{ steps.package.outputs.catalog_zip_path }}" \
            --jq .id
          echo "release_id=$RELEASE_ID" >> "$GITHUB_OUTPUT"

      - name: Update Package.swift and push to master
        id: manifest
        run: |
          cat > Package.swift <<EOF
          // swift-tools-version: 6.0
          import PackageDescription

          let package = Package(
              name: "Orbit",
              platforms: [
                  .iOS(.v15)
              ],
              products: [
                  // Event definitions only (e.g. TabClicked, WorldIdTab).
                  .library(name: "OrbitCatalog", targets: ["OrbitCatalog"]),
              ],
              targets: [
                  .binaryTarget(
                      name: "OrbitCatalog",
                      // url/checksum are rewritten by the Publish workflow on every release.
                      url: "https://github.com/$GITHUB_REPOSITORY/releases/download/v$VERSION/OrbitCatalog-$VERSION.xcframework.zip",
                      checksum: "${{ steps.package.outputs.catalog_checksum }}"
                  ),
              ]
          )
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Package.swift
          git commit -m "chore: release v$VERSION"
          git push origin HEAD:master
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Publish release
        run: |
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/${{ steps.draft.outputs.release_id }}" \
            -F draft=false \
            -f target_commitish="${{ steps.manifest.outputs.sha }}"
