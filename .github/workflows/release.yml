name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version part to bump"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

concurrency:
  group: release-bump
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  bump-version:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BUMP: ${{ inputs.bump }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master

      - name: Compute next version
        id: version
        run: |
          set -euo pipefail
          CURRENT=$(cat VERSION)
          if ! echo "$CURRENT" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::VERSION file contains '$CURRENT', which is not a plain semver (X.Y.Z)"
            exit 1
          fi
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          case "$BUMP" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
            *) echo "::error::Unknown bump type '$BUMP'"; exit 1 ;;
          esac
          NEW_VERSION="$MAJOR.$MINOR.$PATCH"

          if git ls-remote --exit-code --tags origin "refs/tags/v$NEW_VERSION" > /dev/null 2>&1; then
            echo "::error::Tag v$NEW_VERSION already exists"
            exit 1
          fi

          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "next=$NEW_VERSION" >> "$GITHUB_OUTPUT"

      - name: Reserve release branch
        id: branch
        run: |
          set -euo pipefail
          BRANCH="release/v${{ steps.version.outputs.next }}"
          if git ls-remote --exit-code --heads origin "$BRANCH" > /dev/null 2>&1; then
            echo "::error::Branch $BRANCH already exists -- a bump to this version may already be in flight"
            exit 1
          fi
          echo "name=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Bump VERSION and open PR
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "${{ steps.branch.outputs.name }}"
          echo "${{ steps.version.outputs.next }}" > VERSION
          git add VERSION
          git commit -m "chore: bump version to ${{ steps.version.outputs.next }}"
          git push origin "${{ steps.branch.outputs.name }}"

          CURRENT="${{ steps.version.outputs.current }}"
          NEXT="${{ steps.version.outputs.next }}"
          BODY=$(cat <<EOF
          Bumps version \`$CURRENT\` -> \`$NEXT\` ($BUMP).

          Merging this PR triggers the [Publish workflow](../../actions/workflows/publish.yml), which runs the test suite, publishes the Android artifacts to GitHub Packages, builds the iOS XCFramework, and cuts GitHub release \`v$NEXT\`.
          EOF
          )
          gh pr create \
            --base master \
            --head "${{ steps.branch.outputs.name }}" \
            --title "chore: release v$NEXT" \
            --body "$BODY"
